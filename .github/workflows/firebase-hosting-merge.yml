name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js環境をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Functionsの依存関係をインストール
      - name: Install Function Dependencies
        run: npm ci
        working-directory: ./functions

      # Firebase CLIをセットアップ
      - name: Setup Firebase CLI
        uses: FirebaseExtended/action-setup-firebase-cli@v2
        with:
          # サービスアカウントのシークレットを指定
          serviceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPING_GAME_A8239 }}

      # Firebaseにデプロイ
      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions --project typing-game-a8239