<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
</head>
<body>
    <h1>⌨タイピング⌨</h1>
    <p>スタートボタンを押してね</p>
    <button id="start-button">スタート</button>
    <p id="word-display"></p>
    <div id="placeholder-field"></div>
    <textarea id="input-field" disabled></textarea>
    <p id="score-display"></p>
    <p id="result-display"></p>
    <p>間違えたキー: <span id="incorrect-keys-display"></span></p>

    
    <script src="typing_game.js"></script>
</body>
</html>
