<!DOCTYPE html>
<html lang="ja">
<head>   
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
    <style>
      /* ログイン画面を表示する */
      #login-container {
        display: block;
      }
      /* タイピング画面を非表示にする */
      #typing-container {
        display: none;
      }
    </style>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-container">
      <form id="login-form">
        <h1>ログイン画面</h1>
        <p>メールアドレス</p>
        <input type="email" id="email" required>
        <p>パスワード</p>
        <input type="password" id="password" required>
        <br><br>
        <button id="login-button" type="submit">ログイン</button>
        <button id="signup-button" type="button">新規登録</button>
      </form>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-container">
      <h1>⌨タイピング⌨</h1>
      <p>スタートボタンを押してね</p>
      <!-- ここに移動 -->
      <div id="custom-theme-box" style="margin-bottom:8px; display:none;">
        <label for="custom-theme-input">好きな題材:</label>
        <input type="text" id="custom-theme-input" placeholder="自由に入力してください" style="width: 200px;">
      </div>
      <table>
        <tr>
          <td><button id="start-button">スタート</button></td>
          <td><button id="stop-button">ストップ</button></td>
          <td><button id="diff-button" disabled>差分を表示</button></td>
          <td><button id="close-diff" disabled>差分を閉じる</button></td>
          <td><button id="custom-button">カスタム</button></td>
          <td><button id="show-programs-button">保存プログラム一覧</button></td>
        </tr>
        
      </table>
      
      <p id="word-display"></p>
      <div class="editor-flex-container">
        <div id="placeholder-field"></div>
        <div id="input-field"></div>
        <div id="diff-container"></div> <!-- ここに移動 -->
      </div>
      <p id="score-display"></p>
      <p id="result-display"></p>
      <p>間違えたキー:　<span id="incorrect-keys-display"></span></p>
    </div>

    <!-- プログラム一覧モーダル -->
    <div id="programs-modal">
      <div id="programs-modal-header">
        <div class="programs-modal-header-row">
          <h2>保存されたプログラム一覧</h2>
          <button id="close-programs-modal">閉じる</button>
        </div>
        <div id="programs-tabs">
          <button id="tab-favorite" class="active-tab">★ お気に入り</button>
          <button id="tab-normal">通常</button>
        </div>
      </div>
      <ul id="programs-list"></ul>
    </div>

    <!-- プログラム詳細モーダル（トークルーム） -->
    <div id="program-detail-modal" style="display:none;">
      <div id="program-detail-header">
        <button id="close-program-detail">閉じる</button>
        <span class="favorite-star" id="detail-favorite-star">☆</span>
      </div>
      <pre id="detail-program-code"></pre>
      <div id="gemini-chat-area">
        <div id="chat-history" class="chat-history"></div>
        <div class="chat-input-row">
          <input type="text" id="detail-question-input" placeholder="このプログラムについて質問">
          <button id="detail-ask-gemini">Geminiに質問</button>
          <button id="clear-chat-history">履歴削除</button>
        </div>
      </div>
    </div>


    <!-- Firebase SDK とログイン機能をモジュールで読み込む -->
    <script type="module">
      // Firebase SDK を CDN から読み込む
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
      import { getAuth } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

      // Firebase 設定情報
      const firebaseConfig = {
        apiKey: 'AIzaSyBW_5YU8b3vRSrmWtza7Tx50XQcR1s8U_c',
        authDomain: 'typing-game-a8239.firebaseapp.com',
        projectId: 'typing-game-a8239',
      };

      // Firebase アプリの初期化
      initializeApp(firebaseConfig);
    </script>

    <!-- Monaco Editor CDN -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>

    <script type="module" src="login.js"></script>
    <script type="module" src="typing_game.js"></script>
    <script>
      window.MonacoEnvironment = { getWorkerUrl: () => proxy };
      let proxy = URL.createObjectURL(new Blob([`
        self.MonacoEnvironment = {baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'};
        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
      `], { type: 'text/javascript' }));

      require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
      require(['vs/editor/editor.main'], function () {
        window.monaco = monaco;

        window.placeholderEditor = monaco.editor.create(document.getElementById('placeholder-field'), {
          value: '',
          language: 'c',
          theme: 'vs', // ← ここを 'vs-dark' から 'vs' に変更
          fontSize: 16,
          automaticLayout: true,
          minimap: { enabled: false },
          readOnly: true,
          renderLineHighlight: 'none',
          scrollbar: { vertical: 'hidden', horizontal: 'hidden' },
          lineNumbers: 'on',
          overviewRulerLanes: 0,
          renderWhitespace: 'none',
          renderIndentGuides: false,
          folding: false,
          contextmenu: false,
          cursorStyle: 'line',
          cursorBlinking: 'solid'
        });

        window.editor = monaco.editor.create(document.getElementById('input-field'), {
          value: '',
          language: 'c',
          theme: 'vs', // ← ここも 'vs'
          fontSize: 16,
          automaticLayout: true,
          minimap: { enabled: false }
        });

        // editorのスクロールをplaceholderEditorに同期
        window.editor.onDidScrollChange((e) => {
          if (window.placeholderEditor) {
            if (e.scrollTopChanged) {
              window.placeholderEditor.setScrollTop(e.scrollTop);
            }
            if (e.scrollLeftChanged) {
              window.placeholderEditor.setScrollLeft(e.scrollLeft);
            }
          }
        });
        
        // 必要に応じてeditor.getValue()で入力値を取得できます

        // ここでスタートボタンを有効化
        document.getElementById("start-button").disabled = false;
        document.getElementById("custom-button").disabled = false;

        // ここでsetupGameEventsを呼ぶ
        import('./game_logic.js').then(module => {
          module.setupGameEvents();
        });

        // 入力補完のカスタマイズ
        monaco.languages.registerCompletionItemProvider('c', {
          provideCompletionItems: function(model, position) {
            // C言語のキーワードと主要な標準ライブラリ関数
            const predefinedWords = new Set([
              'auto', 'break', 'case', 'char', 'const', 'continue', 'default', 'do', 'double', 'else', 'enum', 'extern', 'float', 'for', 'goto', 'if', 'int', 'long', 'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch', 'typedef', 'union', 'unsigned', 'void', 'volatile', 'while',
              'printf', 'scanf', 'fprintf', 'fscanf', 'sprintf', 'sscanf', 'fopen', 'fclose', 'fread', 'fwrite', 'fseek', 'ftell', 'rewind', 'getchar', 'putchar', 'gets', 'puts', 'perror', 'FILE', 'NULL', 'EOF', 'stdin', 'stdout', 'stderr',
              'malloc', 'calloc', 'realloc', 'free', 'atoi', 'atof', 'atol', 'rand', 'srand', 'system', 'exit', 'abs', 'labs',
              'strcpy', 'strncpy', 'strcat', 'strncat', 'strcmp', 'strncmp', 'strlen', 'strchr', 'strrchr', 'strstr',
              'sin', 'cos', 'tan', 'sqrt', 'pow', 'log', 'exp', 'fabs',
              'time', 'clock', 'difftime', 'time_t', 'clock_t',
              'include', 'stdio', 'stdlib', 'string', 'math', 'time'
            ]);

            const editorText = window.editor.getValue();
            const placeholderText = window.placeholderEditor.getValue();

            const typedWords = new Set([...editorText.matchAll(/[a-zA-Z_][a-zA-Z0-9_]*/g)].map(m => m[0]));
            const placeholderWords = new Set([...placeholderText.matchAll(/[a-zA-Z_][a-zA-Z0-9_]*/g)].map(m => m[0]));

            const wordInfo = model.getWordAtPosition(position);
            const range = wordInfo ?
                new monaco.Range(position.lineNumber, wordInfo.startColumn, position.lineNumber, wordInfo.endColumn) :
                new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column);

            const suggestionLabels = new Set();
            for (const word of placeholderWords) {
                if (predefinedWords.has(word) || typedWords.has(word)) {
                    suggestionLabels.add(word);
                }
            }

            const finalSuggestions = [];
            for (const label of suggestionLabels) {
                finalSuggestions.push({
                    label: label,
                    kind: predefinedWords.has(label) ? monaco.languages.CompletionItemKind.Keyword : monaco.languages.CompletionItemKind.Text,
                    insertText: label,
                    range: range
                });
            }

            return { suggestions: finalSuggestions };
          }
        });
      });""

      diffButton.addEventListener("click", () => {
        if (!window.placeholderEditor || !window.editor) return;

        const original = window.placeholderEditor.getValue();
        const modified = window.editor.getValue();

        // jsdiffを使って差分取得
        const diff = Diff.createPatch('diff', original, modified);

        // 結果をalertやモーダルで表示
        alert(diff);
      });
    </script>
</body>
</html>
