<!DOCTYPE html>
<html lang="ja">
<head>   
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
    <style>
      /* ログイン画面を表示する */
      #login-container {
        display: block;
      }
      /* タイピング画面を非表示にする */
      #typing-container {
        display: none;
      }
    </style>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-container">
      <form id="login-form">
        <h1>ログイン</h1>
        <p>メールアドレス</p>
        <input type="email" id="email" required>
        <p>パスワード</p>
        <input type="password" id="password" required>
        <button id="login-button" type="submit">ログイン</button>
      </form>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-container">
      <h1>⌨タイピング⌨</h1>
      <p>スタートボタンを押してね</p>
      <table>
        <tr>
          <td><button id="start-button">スタート</button></td>
          <td><button id="stop-button">ストップ</button></td>
        </tr>
        
      </table>
      
      <p id="word-display"></p>
      <div class="editor-flex-container">
        <div id="placeholder-field"></div>
        <div id="input-field"></div>
      </div>
      <p id="score-display"></p>
      <p id="result-display"></p>
      <p>間違えたキー: <span id="incorrect-keys-display"></span></p>
    </div>

    <!-- Firebase SDK とログイン機能をモジュールで読み込む -->
    <script type="module">
      // Firebase SDK を CDN から読み込む
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
      import { getAuth } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

      // Firebase 設定情報
      const firebaseConfig = {
        apiKey: 'AIzaSyBW_5YU8b3vRSrmWtza7Tx50XQcR1s8U_c',
        authDomain: 'typing-game-a8239.firebaseapp.com',
        projectId: 'typing-game-a8239',
      };

      // Firebase アプリの初期化
      initializeApp(firebaseConfig);
    </script>

    <!-- Monaco Editor CDN -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

    <script type="module" src="login.js"></script>
    <script type="module" src="typing_game.js"></script>
    <script>
      window.MonacoEnvironment = { getWorkerUrl: () => proxy };
      let proxy = URL.createObjectURL(new Blob([`
        self.MonacoEnvironment = {baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'};
        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
      `], { type: 'text/javascript' }));

      require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
      require(['vs/editor/editor.main'], function () {
        // プレースホルダー用（readonly）
        window.placeholderEditor = monaco.editor.create(document.getElementById('placeholder-field'), {
          value: '',
          language: 'c',
          theme: 'vs', // ← ここを 'vs-dark' から 'vs' に変更
          fontSize: 16,
          automaticLayout: true,
          minimap: { enabled: false },
          readOnly: true,
          renderLineHighlight: 'none',
          scrollbar: { vertical: 'hidden', horizontal: 'hidden' },
          lineNumbers: 'off',
          overviewRulerLanes: 0,
          renderWhitespace: 'none',
          renderIndentGuides: false,
          folding: false,
          contextmenu: false,
          cursorStyle: 'line',
          cursorBlinking: 'solid'
        });

        // 入力用
        window.editor = monaco.editor.create(document.getElementById('input-field'), {
          value: '',
          language: 'c',
          theme: 'vs', // ← ここも 'vs'
          fontSize: 16,
          automaticLayout: true,
          minimap: { enabled: false }
        });
        // 必要に応じてeditor.getValue()で入力値を取得できます
      });
    </script>
</body>
</html>
