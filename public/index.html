<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
</head>
<body>
    <h1>Typing Game</h1>
    <p>ゲームを始めるにはスタートボタンを押してください</p>
    <button id="start-button">スタート</button>
    <p id="word-display"></p>
    <input type="text" id="input-field" disabled>
    <p id="score-display"></p>
    <p id="result-display"></p>
    <p>間違えたキー: <span id="incorrect-keys-display"></span></p>

    
    <script src="typing_game.js"></script>
</body>
</html>
